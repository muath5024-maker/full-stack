name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r multivendor-platform/backend/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run backend tests
        working-directory: multivendor-platform/backend
        run: pytest -q

  staging-deploy:
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose-plugin
      - name: Build and bring up staging stack
        working-directory: multivendor-platform
        run: |
          docker compose -f docker-compose.yml up -d --build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        working-directory: multivendor-platform/frontend
        run: |
          npm ci
      - name: Run frontend tests
        working-directory: multivendor-platform/frontend
        run: npm test --silent
