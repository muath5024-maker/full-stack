services:
  fastapi:
    build: ./backend
    ports:
      - "8000:8000"
    # Load sensitive env from the workers folder (workers/.env)
    env_file:
      - ../workers/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - supabase-local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  supabase-local:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: multivendor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  worker-ai:
    build: ../workers
    working_dir: /app/workers
    ports:
      - "9001:9001"
    env_file:
      - ../workers/.env
    command: python ai_worker.py

  worker-media:
    build: ../workers
    working_dir: /app/workers
    ports:
      - "9002:9002"
    env_file:
      - ../workers/.env
    command: python media_worker.py

  worker-deploy:
    build: ../workers
    working_dir: /app/workers
    ports:
      - "9003:9003"
    env_file:
      - ../workers/.env
    command: python deploy_worker.py

volumes:
  redis_data:
  postgres_data:
  minio_data:
